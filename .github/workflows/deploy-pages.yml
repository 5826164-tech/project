name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: flutter_app/pubspec.yaml

      - name: Set base path
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository" == "${GITHUB_REPOSITORY%%/*}.github.io" ]]; then
            echo "BASE_HREF=/" >> "$GITHUB_ENV"
          else
            echo "BASE_HREF=/$repository/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter web
        working-directory: flutter_app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build web --release --base-href "$BASE_HREF" \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN" \
            --dart-define="FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
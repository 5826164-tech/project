name: plant_disease_app
description: AI-Based Plant Disease Detection and Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  
  # Image
  image_picker: ^1.1.2
  camera: ^0.10.5+9
  
  # HTTP
  http: ^1.2.1
  http_parser: ^4.1.2
  mime: ^2.1.0
  
  # State Management
  provider: ^6.1.2
  
  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  
  # Utils
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

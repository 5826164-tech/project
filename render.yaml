services:
  - type: web
    name: plantcare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PLANTNET_API_KEY
        sync: false